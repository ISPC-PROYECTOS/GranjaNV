services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: granjanv_backend
    restart: always
    env_file:
      - .env
    # No exponer puertos públicamente: Nginx actúa como puerta de entrada
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend/granjanv
      dockerfile: Dockerfile
    container_name: granjanv_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend