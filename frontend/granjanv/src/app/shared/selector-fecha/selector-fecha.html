<div class="dropdown">
  <button
    type="button"
    class="selector-fecha-caja"
    data-bs-toggle="dropdown"
    data-bs-auto-close="outside"
    aria-expanded="false"
    title="Filtrar por fecha"
  >
    <i class="hgi-stroke hgi-calendar-01"></i>
  </button>

  <div class="dropdown-menu dropdown-menu-end p-3 panel-filtro-fechas shadow">
    <div class="mb-2">
      <label class="form-label mb-1">Tipo de filtro</label>

      <select class="form-select form-select-sm" [(ngModel)]="tipoFiltro" (change)="onCambioTipo()">
        @if (permitirTodos) {
          <option value="todos">Todos</option>
        }
        <option value="mes">Por mes</option>
        <option value="rango">Rango de fechas</option>
      </select>
    </div>

    @if (tipoFiltro === 'mes') {
      <div>
        <label class="form-label mb-1">Mes</label>
        <input type="month" class="form-control form-control-sm" [(ngModel)]="mesSeleccionado" />
      </div>
    } @else if (tipoFiltro === 'rango') {
      <div class="d-flex flex-column gap-2">
        <div>
          <label class="form-label mb-1">Desde</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="fechaDesde" [max]="maxFecha || ''" />
        </div>

        <div>
          <label class="form-label mb-1">Hasta</label>
          <input type="date" class="form-control form-control-sm" [(ngModel)]="fechaHasta" [max]="maxFecha || ''" />
        </div>
      </div>
    }

    <div class="d-flex gap-2 mt-3">
      <button type="button" class="btn-restablecer-filtro" (click)="restablecerFiltro()">
        Restablecer
      </button>

      <button 
        type="button" 
        class="btn-restablecer-filtro bg-success text-white border-0" 
        data-bs-dismiss="dropdown"
        (click)="confirmarSeleccion()">
        Seleccionar
      </button>
    </div>
  </div>
</div>
