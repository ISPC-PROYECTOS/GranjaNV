<div class="login-wrapper">
  <div class="login-container">
    
    <!-- Card 1: Imagen ilustrativa -->
    <div class="card card-image">
      <img src="assets/images/login-banner.jpg" alt="Granja NV" class="bg-img" />
    </div>

    <!-- Card 2: Formulario de Login -->
    <div class="card card-form">
      <div class="header">
        <h1>GRANJA NV</h1>
        <p>Ingreso al sistema</p>
      </div>

      <!-- Alerta de Error -->
      @if (errorMessage()) {
        <div class="alert-error">
          {{ errorMessage() }}
        </div>
      }

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        
        <!-- Campo Correo Electrónico -->
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="usuario@granjanv.com"
            [class.is-invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          />
          @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
            <span class="error-msg">Ingrese un correo válido.</span>
          }
        </div>

        <!-- Campo Contraseña -->
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
            [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          />
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <span class="error-msg">La contraseña es requerida.</span>
          }
        </div>

        <!-- Acciones: Dos botones -->
        <div class="button-group">
          <button 
            type="submit" 
            class="btn btn-login" 
            [disabled]="isLoading() || loginForm.invalid">
            {{ isLoading() ? 'Iniciando...' : 'Iniciar Sesión' }}
          </button>

          <button 
            type="button" 
            class="btn btn-recovery" 
            (click)="onForgotPassword()"
            [disabled]="isLoading()">
            Recuperar contraseña
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
