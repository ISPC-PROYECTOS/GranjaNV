<div class="tips-container">
  <h2 class="section-title">{{ titulo }}</h2>

  <section class="tips-subsection recetas-section">
    <h3 class="subsection-title">Recetas</h3>

    @if (recetas.length > 0) {
      <app-carrusel [items]="recetas">
        <ng-template #itemTemplate let-receta>
          <article class="tip-card recipe-card">
            <div class="tip-icon">
              @if (receta.imagen) {
                <img [src]="receta.imagen" [alt]="receta.titulo" class="receta-img">
              } @else {
                IMG
              }
            </div>
            <h4>{{ receta.titulo }}</h4>
            <p>{{ receta.descripcion }}</p>
          </article>
        </ng-template>
      </app-carrusel>
    } @else {
      <p class="cargando-texto">Cargando recetas...</p>
    }
  </section>

  <section class="tips-subsection cuidados-section">
    <h3 class="subsection-title">Cuidados de los huevos</h3>
    <div class="tips-grid">
      <article class="tip-card care-card" *ngFor="let cuidado of cuidados">
        <div class="tip-icon">IMG</div>
        <h4>{{ cuidado.titulo }}</h4>
        <p>{{ cuidado.descripcion }}</p>
      </article>
    </div>
  </section>
</div>
