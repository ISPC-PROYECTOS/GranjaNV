<div class="not-found-wrapper">
  <div class="not-found-container">
    
    <div class="card card-404">
      <div class="icon-circle">
        <i class="hgi-stroke hgi-alert-circle"></i>
      </div>

      <h1 class="error-code">404</h1>
      <h2 class="error-title">Página no encontrada</h2>
      
      <p class="error-description">
        La ruta a la que intentás acceder no existe, ha sido modificada o no se encuentra disponible.
      </p>

      <div class="button-group">
        <button type="button" class="btn btn-action" (click)="volver()">
          Volver a un lugar seguro
        </button>
      </div>
    </div>

  </div>
</div>
