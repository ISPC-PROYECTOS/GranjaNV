<div class="registro-container">
  <h3>Alta de Nuevo Usuario</h3>

  @if (successMessage()) {
    <div class="success-alert">{{ successMessage() }}</div>
  }
  @if (errorMessage()) {
    <div class="error-alert">{{ errorMessage() }}</div>
  }

  <form [formGroup]="registroForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="reg-email">Correo Electrónico</label>
      <input id="reg-email" type="email" formControlName="email" />
    </div>

    <div class="form-group">
      <label for="reg-password">Contraseña</label>
      <input id="reg-password" type="password" formControlName="password" />
    </div>

    <div class="form-group">
      <label for="reg-nombre">Nombre</label>
      <input id="reg-nombre" type="text" formControlName="nombre" />
    </div>

    <div class="form-group">
      <label for="reg-apellido">Apellido</label>
      <input id="reg-apellido" type="text" formControlName="apellido" />
    </div>

    <div class="form-group">
      <label for="reg-rol">Rol</label>
      <select id="reg-rol" formControlName="rol">
        <option value="Empleado">Empleado</option>
        <option value="Administrador">Administrador</option>
      </select>
    </div>

    <button type="submit" [disabled]="registroForm.invalid">Registrar</button>
  </form>
</div>
